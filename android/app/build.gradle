apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.google.mlkit.vision.demo'
    compileSdk 35

    defaultConfig {
        applicationId "com.google.mlkit.vision.demo"
        minSdk 24
        targetSdk 35
        multiDexEnabled true
        versionCode 30
        versionName "3.0-mod"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        setProperty("archivesBaseName", "pose-estimation-mod")
        // Only ship the arm64 build of onnxruntime (matches the user's device);
        // trims ~120MB from the APK.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    // Do NOT compress ONNX/TFLite/NCNN model files (important for direct asset load).
    aaptOptions {
        noCompress "onnx", "tflite", "ncnn"
    }
}

dependencies {
    // Pose detection (ML Kit) - the core skeleton used by the original app
    implementation 'com.google.mlkit:pose-detection:17.0.0'
    implementation 'com.google.mlkit:pose-detection-accurate:17.0.0'

    // Our YOLO runtimes
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX (stable release build, replaces the dead SNAPSHOT repo)
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.guava:guava:31.1-android'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}

configurations {
    // Resolves dependency conflict caused by some dependencies use
    // com.google.guava:guava and com.google.guava:listenablefuture together.
    all*.exclude group: 'com.google.guava', module: 'listenablefuture'
}